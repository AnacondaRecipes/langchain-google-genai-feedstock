{% set name_dev = "langchain-google" %}
{% set name_proj = "genai" %}
{% set name = name_dev + "-" + name_proj %}
{% set alt_name = name.replace('-', '_') %}
{% set version = "4.4.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ alt_name }}-{{ version }}.tar.gz
  sha256: 0872df6de1ebf031c4dad59aead504f168ff31a4d73ea74e52bb1fcdb8f4ab91

build:
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - langchain-core >=1.6.10,<2.0.0
    - google-genai >=2.20.0,<3.0.0
    - pydantic >=2.0.0,<3.0.0
    - filetype >=1.2.0,<2.0.0

# ignoring tests because of missing langchain-tests pkg on the main channel
{% set tests_to_ignore = "--ignore=tests/unit_tests/test_standard.py" %}

test:
  source_files:
    - tests
  imports:
    - langchain_google_genai
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - pytest-mock
    - numpy
    - protobuf
    - aiohttp
  commands:
    - pip check
    - pytest -vv -o asyncio_mode=auto tests/unit_tests {{ tests_to_ignore }}

about:
  home: https://github.com/langchain-ai/langchain-google
  summary: An integration package connecting Google's genai package and LangChain
  description: |
    This package contains the LangChain integrations for Gemini through their generative-ai SDK.
  license: MIT
  license_file: LICENSE
  license_family: MIT
  doc_url: https://python.langchain.com/api_reference/google_genai
  dev_url: https://github.com/langchain-ai/langchain-google/tree/main/libs/genai

extra:
  recipe-maintainers:
    - jan-janssen
